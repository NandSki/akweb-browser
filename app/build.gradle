plugins {
    id("com.android.application")
    // AGP 9+: Kotlin bawaan, plugin kotlin.android sengaja TIDAK dipakai.
}

android {
    namespace = "com.akweb.browser"
    compileSdk = 37
    defaultConfig {
        applicationId = "com.akweb.browser"
        minSdk = 26
        targetSdk = 34
        versionCode = 20
        versionName = "0.1.19-review"
        // Ringankan APK: Redmi 13C (Helio G85) itu ARM 64-bit, jadi cukup
        // lib arm64-v8a. Tanpa filter, APK ikut membawa lib x86_64
        // (emulator, ~185 MB) dan armeabi-v7a (32-bit, ~130 MB) yang
        // tidak pernah dipakai HP ini. Perkiraan APK baru ~190 MB.
        ndk {
            abiFilters += "arm64-v8a"
        }
    }
    buildTypes {
        debug {
            // 2026-11-11: kunci debug PERSISTEN — keystore/akweb-debug.p12
            // (dibuat sekali, di-commit ke repo private ini). Sebelum ini
            // assembleDebug pakai debug key bawaan runner CI yang dibuat
            // baru tiap run, jadi tiap versi APK punya kunci beda dan
            // Android menolak install menimpa versi lama (user harus
            // uninstall dulu). Dengan kunci ini, semua versi ke depan
            // pakai tanda tangan yang sama -> tinggal timpa. Catatan:
            // ini kunci DEBUG (password standar "android"), bukan kunci
            // rilis — aman di-commit ke repo private. Sidik jari SHA-256
            // sertifikat: 4D:E0:EA:6E:28:98:5D:0D:48:61:8C:B6:EE:4B:62:04:
            // 24:E4:09:EB:7A:35:E1:8B:07:11:A3:1C:A5:96:55:C3.
            signingConfig = signingConfigs.getByName("debug")
        }
        release {
            minifyEnabled = false
        }
    }
    signingConfigs {
        getByName("debug") {
            storeFile = file("../keystore/akweb-debug.p12")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
            storeType = "PKCS12"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
}

dependencies {
    // GeckoView 157 terbit: 157.0.20261005135250, memenuhi
    // strict_min_version 157.0 di manifest ekstensi, dan menuntut
    // compileSdk minimal 37 (lihat log checkDebugAarMetadata).
    implementation("org.mozilla.geckoview:geckoview:157.0.20261005135250")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.2.10")
    testImplementation("junit:junit:4.13.2")
}

// Fix 2026-10-28: kompilator Kotlin bawaan AGP 9.1 (2.2.0) tidak
// bisa membaca kotlin-stdlib 2.4.20 yang ditarik transitif (metadata
// 2.4.0, kompilator hanya baca sampai 2.3.0) sehingga
// compileDebugKotlin gagal. Paksa semua modul stdlib ke 2.2.10.
configurations.all {
    resolutionStrategy {
        force("org.jetbrains.kotlin:kotlin-stdlib:2.2.10")
        force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10")
        force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10")
        force("org.jetbrains.kotlin:kotlin-reflect:2.2.10")
        force("org.jetbrains.kotlin:kotlin-annotations:2.2.10")
    }
}
