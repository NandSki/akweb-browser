# Build 8BP Solver Browser (debug) — pola yang sama dengan proyek lama 8bp-apk.
# STATUS PUSH (2026-10-27): user SUDAH SETUJU memakai repo private
# NandSki/8bp-apk untuk build ini dan minta cepat. Workflow ini SIAP PUSH,
# tapi push/build TIDAK dilakukan oleh subagent pembuat proyek — parent
# me-review dulu, lalu push dan menjalankan workflow_dispatch sendiri
# (lihat STATUS.md, bagian "Cara push cepat"). Dijalankan manual dari
# tab Actions (workflow_dispatch) setelah versi GeckoView di
# app/build.gradle dikonfirmasi ke artefak yang terbit.
#
# Konfigurasi proyek setelah fix 2026-10-27: AGP 9.1.1, Gradle 9.3.1,
# Java 17, compileSdk 37 (GeckoView 157 menuntutnya), targetSdk 34.
# Perbedaan dari proyek lama: dependensi GeckoView (org.mozilla.geckoview)
# dan android.useAndroidX=true (lihat gradle.properties).
name: Build 8BP Solver Browser (debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages (android-37)
        run: |
          SDKMGR="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKMGR (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      # 2026-11-08: gradle/gradle-build-action gagal 3x berturut-turut di
      # "Provision Gradle 9.3.1" (download distribusi kena HTTP 504 +
      # cache service 400 — infra GitHub, bukan kode; kompilasi belum
      # sempat jalan). Workaround: download Gradle langsung via curl.
      # services.gradle.org JUGA 504 dari runner (redirect-nya ke GitHub
      # Releases), jadi pakai mirror Huawei — SHA256 diverifikasi sama
      # dengan checksum resmi services.gradle.org
      # (b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06).
      # Bila setup-gradle sudah pulih, boleh dikembalikan ke action.
      - name: Install Gradle 9.3.1 (direct download)
        run: |
          curl -fsSL -o /tmp/gradle-9.3.1-bin.zip https://mirrors.huaweicloud.com/gradle/gradle-9.3.1-bin.zip
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  /tmp/gradle-9.3.1-bin.zip" | sha256sum -c -
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK + unit test
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
